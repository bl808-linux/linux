%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/bflb,bl808-mm-spi-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bouffalo Lab BL808 multimedia SPI1 clock and reset

maintainers:
  - Kwanghoon Son <asdfkwang@gmail.com>

description: |
  The SPI1 leaf clock selects multimedia XCLK, divides and gates it.
  The provider uses the firmware-selected crystal XCLK without changing
  the shared clock root. The single reset specifier is zero for SPI1.

properties:
  compatible:
    const: bflb,bl808-mm-spi-clock
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: xtal
  "#clock-cells":
    const: 0
  "#reset-cells":
    const: 1

required: [compatible, reg, clocks, clock-names, "#clock-cells", "#reset-cells"]
additionalProperties: false
