%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/bflb,bl808-mcu-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bouffalo Lab BL808 MCU interrupt forwarding controller

description: |
  Two banks of 32 MCU peripheral interrupt forwarding latches, masks and
  write-one-to-clear registers. Both banks feed D0 PLIC source 81. UART2
  uses input 30.

maintainers:
  - Kwanghoon Son <asdfkwang@gmail.com>

properties:
  compatible:
    const: bflb,bl808-mcu-intc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#address-cells":
    const: 0

  "#interrupt-cells":
    const: 2
    description: MCU source index followed by IRQ_TYPE_LEVEL_HIGH.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - "#address-cells"
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    interrupt-controller@20000050 {
        compatible = "bflb,bl808-mcu-intc";
        reg = <0x20000050 0x18>;
        interrupts = <81 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-controller;
        #address-cells = <0>;
        #interrupt-cells = <2>;
    };
