%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/bflb,uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bouffalo Lab UART Controller

description: |
  UART IP used by Bouffalo Lab SoCs. Initial Linux support covers the
  BL808 controller with a 32-byte FIFO. The compatible follows Zephyr.

maintainers:
  - Kwanghoon Son <asdfkwang@gmail.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: bflb,uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: APB register interface clock
      - description: Baud rate generator clock

  clock-names:
    items:
      - const: apb
      - const: baud

  dmas:
    minItems: 1
    items:
      - description: Receive DMA channel
      - description: Transmit DMA channel

  dma-names:
    minItems: 1
    items:
      - const: rx
      - const: tx

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

dependentRequired:
  dmas: [dma-names]
  dma-names: [dmas]

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    uart3: serial@30002000 {
        compatible = "bflb,uart";
        reg = <0x30002000 0x1000>;
        interrupts = <20 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&uart_apb>, <&uart_baud>;
        clock-names = "apb", "baud";
    };
...
