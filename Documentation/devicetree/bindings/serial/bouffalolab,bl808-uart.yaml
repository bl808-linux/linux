%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/bouffalolab,bl808-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bouffalo Lab UART Controller

description: |
  UART IP used by Bouffalo Lab SoCs. Initial Linux support covers the
  BL808 controller with a 32-byte FIFO. The compatible identifies the BL808 UART.

maintainers:
  - Kwanghoon Son <asdfkwang@gmail.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: bouffalolab,bl808-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Baud rate generator clock

  clock-names:
    items:
      - const: baud

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    uart3: serial@30002000 {
        compatible = "bouffalolab,bl808-uart";
        reg = <0x30002000 0x1000>;
        interrupts = <20 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&uart_baud>;
        clock-names = "baud";
    };
...
