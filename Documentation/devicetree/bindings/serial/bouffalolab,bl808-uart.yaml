%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/bouffalolab,bl808-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bouffalo Lab UART Controller

description: |
  The Bouffalo Lab BL808 UART controller has a 32-byte FIFO, an APB
  register interface and a separate baud rate generator clock.

maintainers:
  - Kwanghoon Son <asdfkwang@gmail.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: bouffalolab,bl808-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: APB register interface clock
      - description: Baud rate generator clock

  clock-names:
    items:
      - const: apb
      - const: baud

  resets:
    maxItems: 1
    description: UART peripheral reset

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    serial@30002000 {
        compatible = "bouffalolab,bl808-uart";
        reg = <0x30002000 0x1000>;
        interrupts = <20 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&uart_apb>, <&uart_baud>;
        clock-names = "apb", "baud";
    };
...
